name: Bug report
description: Something in Crest does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search the open issues first, in case it is already known.

        If Crest crashed, the crash log helps a lot. It is `crash.log` in `%LOCALAPPDATA%\io.github.andrealo20.crest\logs` for the installed app, in `data\logs` next to Crest.exe for the portable build, or in `~/Library/Logs/io.github.andrealo20.crest` on a Mac (see [Crash log](https://github.com/andrealo20/crest/blob/main/docs/features.md#install-in-detail)). Check it for anything private before you attach it.
  - type: input
    id: system
    attributes:
      label: System version
      description: On Windows press Win + R, type `winver` and copy the line with the version and build. On a Mac, Apple menu → About This Mac, and say whether it is Apple silicon or Intel.
      placeholder: Windows 11 24H2, build 26100.2314, or macOS 15.1 on Apple silicon
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Crest version
      description: Shown in Settings → General → Updates.
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - Microsoft Store
        - Installer from GitHub Releases
        - Portable zip
        - macOS disk image (.dmg)
        - Built from source
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the notch
        2. Go to ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead. Screenshots or a short recording help.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Crash log or other details
      description: Paste the relevant part of crash.log, or anything else that might matter (monitors and scaling, screen edge, the tool in use).
      render: text

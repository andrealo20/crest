name: Old site redirect

# The site moved from andrealo20.github.io/crest to crestisland.app. GitHub Pages cannot answer with a redirect, so this
# publishes one small page there, as index.html and as 404.html, that sends every old address to the same path on the new
# domain. Run it by hand once; links in old release notes and posts then keep working.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write the redirect page
        run: |
          mkdir out
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Crest moved to crestisland.app</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://crestisland.app/">
          <meta http-equiv="refresh" content="0; url=https://crestisland.app/">
          <script>location.replace("https://crestisland.app" + location.pathname.replace(/^\/crest/, "") + location.search + location.hash);</script>
          </head>
          <body>
          <p>Crest's website is now at <a href="https://crestisland.app/">crestisland.app</a>.</p>
          </body>
          </html>
          HTML
          cp out/index.html out/404.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

name: Release

# Pushing a new version (src-tauri/tauri.conf.json) to main publishes a release:
# signed installer, .sig and latest.json for the in-app updater.
# Pushes without a version bump only run the check and stop.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      notes: ${{ steps.version.outputs.notes }}
      highlights: ${{ steps.version.outputs.highlights }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          # Hand-written notes with screenshots (docs/releases/vX.Y.Z.md), if there are any.
          {
            echo "highlights<<EOF"
            cat "docs/releases/v$version.md" 2>/dev/null && echo || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # Changes since the previous release tag.
          previous=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          range=${previous:+$previous..HEAD}
          {
            echo "notes<<EOF"
            git log --no-merges --pretty='- %s' $range | grep -v '^- Merge' || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # crest-notify ships in the portable zip (scripts/portable-package.ps1): a missing exe must stop the run before
      # tauri-action publishes the installer release.
      - name: Build crest-notify
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo build --release --bin crest-notify
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path target/release/crest-notify.exe)) { Write-Error "target/release/crest-notify.exe is missing"; exit 1 }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: Crest v__VERSION__
          releaseDraft: false
          prerelease: false
          releaseBody: |
            **Install:** download `Crest_${{ needs.check.outputs.version }}_x64-setup.exe` below and run it. No admin rights or developer tools needed.
            Already installed? The app offers this version under **Settings → General → Updates**.

            **Portable:** `Crest-${{ needs.check.outputs.version }}-Portable-x64.zip` needs no install: unzip it anywhere you can write to and run Crest.exe. It keeps its data in a `data` folder next to it and updates itself in place.

            Windows SmartScreen may warn because the installer is not code-signed yet: **More info → Run anyway**.

            ${{ needs.check.outputs.highlights }}

            ### Changes
            ${{ needs.check.outputs.notes }}

      # Portable zip next to the installer: signed like it, and listed in latest.json as windows-x86_64-portable,
      # the entry a portable copy updates from (src-tauri/src/portable.rs).
      - name: Portable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $zip = "Crest-$env:VERSION-Portable-x64.zip"
          ./scripts/portable-package.ps1 -Exe src-tauri/target/release/crest.exe -Destination $zip
          npx tauri signer sign $zip
          if ($LASTEXITCODE) { exit 1 }
          gh release upload $tag $zip "$zip.sig" --clobber
          if ($LASTEXITCODE) { exit 1 }
          gh release download $tag --pattern latest.json --clobber
          if ($LASTEXITCODE) { exit 1 }
          # Node, not ConvertFrom-Json: that turns pub_date into a DateTime and writes it back in another format.
          # The script checks that pub_date and the installer entries are unchanged before it writes.
          node scripts/portable-latest.mjs latest.json "$zip.sig" "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$zip"
          if ($LASTEXITCODE) { exit 1 }
          gh release upload $tag latest.json --clobber
          if ($LASTEXITCODE) { exit 1 }

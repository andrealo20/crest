name: CI

# Checks every pull request and every push to main or to a release branch (rel-*), so a failing test or a missing translation shows up before a
# release. The release workflow keeps its own Test steps as a second defence.
on:
  push:
    branches: [main, "rel-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm runs the ARM64 build and macos-latest the Apple silicon one, which the release only compiles.
        os: [windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run i18n
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib
      # Intel Macs run the release's x86_64 build, which runs here under Rosetta.
      - name: Rust tests for Intel Macs
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo test --lib --target x86_64-apple-darwin

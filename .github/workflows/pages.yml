name: Pages

# Builds the project page (site/) and the in-browser demo of the app, and publishes them on GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "src-tauri/src/plugins/sdk.js", "examples/plugins/**", "public/**", "index.html", "timer.html", "mirror.html", "package.json", "package-lock.json", "tsconfig*.json", "vite.config.ts", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
